name: Release Obsidian theme

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Obsidian installs the release whose tag equals manifest.json "version".
      - name: Check tag matches manifest and theme.css is current
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match manifest.json version '$version'" >&2
            exit 1
          fi
          python3 scripts/build.py --check

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            --draft \
            manifest.json theme.css
